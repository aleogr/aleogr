# aleogr-ci 2 web:web:go:1.27 deploy=dev:web project=demo branch=main region=europe-west1
# Generated by aleogr from .aleogr/project.json. Do not edit: change the declaration and run project-apply.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: example-org/tooling/.github/workflows/ci-go.yml@3333333333333333333333333333333333333333
    with:
      working-directory: "web"
      go-version: "1.27"

  deploy-web-dev:
    needs: [web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.web.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: example-org/tooling/.github/workflows/deploy-cloud-run.yml@3333333333333333333333333333333333333333
    with:
      working-directory: "web"
      service: "demo-web"
      image-name: "web"
      region: "europe-west1"
    secrets:
      project-id: ${{ secrets.GCP_PROJECT_ID }}
      workload-identity-provider: ${{ secrets.GCP_WIF_PROVIDER }}
      service-account: ${{ secrets.GCP_CI_ACCOUNT }}
      image-path: ${{ secrets.GCP_IMAGE_PATH }}

  ci:
    needs: [changes, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: The change detection passed, and every component job passed or was skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ needs.web.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then echo "the job changes ended: $CHANGES"; exit 1; fi
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a component job ended: $r"; exit 1 ;; esac
          done
