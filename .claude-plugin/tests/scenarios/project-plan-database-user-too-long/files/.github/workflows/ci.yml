# aleogr-ci 2 api:services/api:go:1.27,webdatabasecheck:webdatabasecheck:go:1.27 deploy=dev:api+webdatabasecheck project=demolongname1 branch=main region=us-central1
# Generated by aleogr from .aleogr/project.json. Do not edit: change the declaration and run project-apply.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      webdatabasecheck: ${{ steps.filter.outputs.webdatabasecheck }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            api:
              - 'services/api/**'
              - '.github/workflows/ci.yml'
            webdatabasecheck:
              - 'webdatabasecheck/**'
              - '.github/workflows/ci.yml'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    uses: aleogr/aleogr/.github/workflows/ci-go.yml@1111111111111111111111111111111111111111
    with:
      working-directory: "services/api"
      go-version: "1.27"

  deploy-api-dev:
    needs: [api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.api.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: aleogr/aleogr/.github/workflows/deploy-cloud-run.yml@1111111111111111111111111111111111111111
    with:
      working-directory: "services/api"
      service: "demolongname1-api"
      image-name: "api"
      region: "us-central1"
    secrets:
      project-id: ${{ secrets.GCP_PROJECT_ID }}
      workload-identity-provider: ${{ secrets.GCP_WIF_PROVIDER }}
      service-account: ${{ secrets.GCP_CI_ACCOUNT }}
      image-path: ${{ secrets.GCP_IMAGE_PATH }}

  webdatabasecheck:
    needs: changes
    if: needs.changes.outputs.webdatabasecheck == 'true'
    uses: aleogr/aleogr/.github/workflows/ci-go.yml@1111111111111111111111111111111111111111
    with:
      working-directory: "webdatabasecheck"
      go-version: "1.27"

  deploy-webdatabasecheck-dev:
    needs: [webdatabasecheck]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.webdatabasecheck.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: aleogr/aleogr/.github/workflows/deploy-cloud-run.yml@1111111111111111111111111111111111111111
    with:
      working-directory: "webdatabasecheck"
      service: "demolongname1-webdatabasecheck"
      image-name: "webdatabasecheck"
      region: "us-central1"
    secrets:
      project-id: ${{ secrets.GCP_PROJECT_ID }}
      workload-identity-provider: ${{ secrets.GCP_WIF_PROVIDER }}
      service-account: ${{ secrets.GCP_CI_ACCOUNT }}
      image-path: ${{ secrets.GCP_IMAGE_PATH }}

  ci:
    needs: [changes, api, webdatabasecheck]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: The change detection passed, and every component job passed or was skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ needs.api.result }} ${{ needs.webdatabasecheck.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then echo "the job changes ended: $CHANGES"; exit 1; fi
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a component job ended: $r"; exit 1 ;; esac
          done
