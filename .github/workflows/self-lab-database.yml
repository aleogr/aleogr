name: self-lab-database

# Starts, stops or checks the Cloud SQL instance of the personal lab.
# Manual only. Authenticates by workload identity federation (no key): the
# provider accepts only tokens of this repository on `main`, and the service
# account can only read and update Cloud SQL instances.
# Logs are public: no step prints the project, the account, an operation name or
# an API response.
# `stop` waits until the Cloud SQL operation is done; `start` returns once the
# change is accepted (the instance takes about ten minutes to accept connections).

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do with the lab database
        type: choice
        options:
          - status
          - start
          - stop
        default: status

permissions:
  contents: read
  id-token: write

concurrency: lab-database

jobs:
  switch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INSTANCE: aleogr-lab
    steps:
      - name: Check the secrets
        env:
          LAB_GCP_PROJECT_ID: ${{ secrets.LAB_GCP_PROJECT_ID }}
          LAB_GCP_WIF_PROVIDER: ${{ secrets.LAB_GCP_WIF_PROVIDER }}
          LAB_GCP_SWITCH_ACCOUNT: ${{ secrets.LAB_GCP_SWITCH_ACCOUNT }}
        run: |
          missing=0
          for name in LAB_GCP_PROJECT_ID LAB_GCP_WIF_PROVIDER LAB_GCP_SWITCH_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret ${name}: see docs/plans/2026-11-17-lab-platform-stage-2-run.md"
              missing=1
            fi
          done
          exit "$missing"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.LAB_GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.LAB_GCP_SWITCH_ACCOUNT }}
          token_format: access_token

      - name: Change the activation policy
        id: change
        if: inputs.action == 'start' || inputs.action == 'stop'
        env:
          ACTION: ${{ inputs.action }}
          PROJECT: ${{ secrets.LAB_GCP_PROJECT_ID }}
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          case "$ACTION" in
            start) policy=ALWAYS ;;
            stop) policy=NEVER ;;
            *) echo "::error::Unknown action"; exit 1 ;;
          esac
          body="$(mktemp)"
          # The response goes to a file: an error body can contain the project id.
          code="$(curl --silent --show-error --fail-with-body \
            --output "$body" --write-out '%{http_code}' \
            --request PATCH \
            --header "Authorization: Bearer ${TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "{\"settings\":{\"activationPolicy\":\"${policy}\"}}" \
            "https://sqladmin.googleapis.com/v1/projects/${PROJECT}/instances/${INSTANCE}" \
            2>/dev/null)" || {
            echo "::error::The Cloud SQL API refused the change (HTTP status ${code:-unknown})."
            exit 1
          }
          echo "HTTP status: ${code}"
          # The operation name is an opaque id: kept in a variable, never printed.
          operation="$(jq -r '.name // ""' "$body" 2>/dev/null || true)"
          case "$operation" in
            ''|*[!A-Za-z0-9-]*)
              echo "::error::The Cloud SQL API accepted the change but returned no usable operation."
              exit 1
              ;;
          esac
          if [ "$ACTION" = "start" ]; then
            # Starting takes about ten minutes: the change is accepted, do not wait for it.
            echo "The start was accepted."
            exit 0
          fi
          # Stop: wait until the operation is done (every 15 seconds, at most about 5 minutes).
          for attempt in $(seq 1 20); do
            sleep 15
            op="$(mktemp)"
            if curl --silent --fail-with-body --output "$op" \
              --header "Authorization: Bearer ${TOKEN}" \
              "https://sqladmin.googleapis.com/v1/projects/${PROJECT}/operations/${operation}" \
              2>/dev/null; then
              status="$(jq -r '.status // ""' "$op" 2>/dev/null || true)"
              if [ "$status" = "DONE" ]; then
                if jq -e 'has("error")' "$op" >/dev/null 2>&1; then
                  echo "::error::The stop operation ended with an error."
                  exit 1
                fi
                echo "The stop is done."
                exit 0
              fi
            fi
          done
          echo "::error::The stop operation did not finish within about 5 minutes."
          exit 1

      - name: Report the state
        if: always() && steps.auth.outcome == 'success'
        env:
          ACTION: ${{ inputs.action }}
          CHANGE: ${{ steps.change.outcome }}
          PROJECT: ${{ secrets.LAB_GCP_PROJECT_ID }}
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          body="$(mktemp)"
          code="$(curl --silent --fail-with-body \
            --output "$body" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${TOKEN}" \
            "https://sqladmin.googleapis.com/v1/projects/${PROJECT}/instances/${INSTANCE}" \
            2>/dev/null)" || {
            echo "::error::Could not read the instance (HTTP status ${code:-unknown})."
            exit 1
          }
          policy="$(jq -r '.settings.activationPolicy // ""' "$body" 2>/dev/null || true)"
          state="$(jq -r '.state // ""' "$body" 2>/dev/null || true)"
          if [ "$policy" = "NEVER" ]; then
            line=stopped
          elif [ "$policy" = "ALWAYS" ] && [ "$state" = "RUNNABLE" ]; then
            # Cloud SQL shows RUNNABLE as soon as a start is accepted, minutes before the
            # instance accepts connections: an unfinished UPDATE operation means "starting".
            line=running
            ops="$(mktemp)"
            if curl --silent --fail-with-body --output "$ops" \
              --header "Authorization: Bearer ${TOKEN}" \
              "https://sqladmin.googleapis.com/v1/projects/${PROJECT}/operations?instance=${INSTANCE}&maxResults=10" \
              2>/dev/null; then
              pending="$(jq -r '[.items[]? | select(.operationType == "UPDATE" and .status != "DONE")] | length' "$ops" 2>/dev/null || echo 0)"
              if [ "${pending:-0}" != "0" ]; then line=starting; fi
            else
              note=" (pending operations could not be checked)"
            fi
          elif [ "$policy" = "ALWAYS" ] && [ "$state" = "PENDING_CREATE" ]; then
            line=creating
          elif [ "$policy" = "ALWAYS" ]; then
            line=starting
          else
            echo "::error::Unexpected instance data."
            exit 1
          fi
          message="${INSTANCE}: ${line}${note:-}"
          if [ "$ACTION" = "start" ] && [ "$CHANGE" = "success" ]; then
            message="${message} (it takes about ten minutes to accept connections; run status to see when it is running)"
          fi
          echo "$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
