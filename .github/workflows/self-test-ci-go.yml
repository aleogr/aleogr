name: self-test-ci-go

# Runs the reusable ci-go.yml on the fixture module in .github/testdata/ci-go,
# on pull requests that change the workflow, this file or the fixture.

on:
  pull_request:
    paths:
      - .github/workflows/ci-go.yml
      - .github/workflows/self-test-ci-go.yml
      - .github/testdata/ci-go/**

permissions:
  contents: read

jobs:
  ci-go:
    uses: ./.github/workflows/ci-go.yml
    with:
      working-directory: .github/testdata/ci-go
      go-version: "1.27"
