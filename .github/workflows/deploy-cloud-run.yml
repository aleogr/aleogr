name: deploy-cloud-run

# Reusable: builds one component's image, pushes it to Artifact Registry and
# replaces the image of its existing Cloud Run service, by digest. Nothing else
# on the service changes: no create, no access change. A missing service fails.
# Called by a project's ci.yml, pinned by commit SHA, from a job that runs only
# on push to the default branch and grants `contents: read` and
# `id-token: write`. Authenticates by workload identity federation (no key).
# Logs are public: the identifiers arrive as secrets, which the runner masks
# from the job's start; the first step masks them again with the project
# number, read from the provider path, then validates the inputs (a failure
# names the input, never its value) before anything else runs. No step prints
# a value. Values reach the scripts only through `env`. The build writes no
# job summary, uploads no build record and makes no check annotations; Buildx
# is not cached.
# The build context is the component's folder, never the repository root (the
# first step refuses `.`, an absolute path and `..`), so the credentials file
# that `auth` writes at the workspace root is outside it.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Folder of the component (its Dockerfile and build context), relative to the repository root
        type: string
        required: true
      service:
        description: Name of the existing Cloud Run service
        type: string
        required: true
      region:
        description: Region of the service and of the Artifact Registry repository (for example us-central1)
        type: string
        required: true
      image-name:
        description: Name of the component's image; the image is <image-path>/<image-name>
        type: string
        required: true
    secrets:
      project-id:
        description: Google Cloud project id
        required: true
      workload-identity-provider:
        description: Full path of the provider, projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
        required: true
      service-account:
        description: E-mail of the CI service account
        required: true
      image-path:
        description: Registry path without the component, <region>-docker.pkg.dev/<project>/<repository>
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-${{ inputs.service }}
      cancel-in-progress: false
    steps:
      - name: Mask the identifiers and validate the inputs
        env:
          PROJECT_ID: ${{ secrets.project-id }}
          SERVICE_ACCOUNT: ${{ secrets.service-account }}
          WIF_PROVIDER: ${{ secrets.workload-identity-provider }}
          IMAGE_PATH: ${{ secrets.image-path }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          SERVICE: ${{ inputs.service }}
          REGION: ${{ inputs.region }}
          IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          if [ -z "$PROJECT_ID" ] || [ -z "$SERVICE_ACCOUNT" ] || [ -z "$WIF_PROVIDER" ] || [ -z "$IMAGE_PATH" ]; then
            echo "::error::An identifier is empty."
            exit 1
          fi
          echo "::add-mask::$PROJECT_ID"
          echo "::add-mask::$SERVICE_ACCOUNT"
          echo "::add-mask::$WIF_PROVIDER"
          echo "::add-mask::$IMAGE_PATH"
          project_number="${WIF_PROVIDER#projects/}"
          project_number="${project_number%%/*}"
          if [[ "$WIF_PROVIDER" != projects/* ]] || [[ ! "$project_number" =~ ^[0-9]+$ ]]; then
            echo "::error::The workload identity provider is not a path that starts with projects/<number>/."
            exit 1
          fi
          echo "::add-mask::$project_number"
          if [[ ! "$WORKING_DIRECTORY" =~ ^[A-Za-z0-9_-][A-Za-z0-9._/-]*$ ]] || [[ "/$WORKING_DIRECTORY/" == */../* ]]; then
            echo "::error::The input working-directory is not a folder inside the repository."
            exit 1
          fi
          if [[ ! "$SERVICE" =~ ^[a-z][a-z0-9-]{0,48}$ ]]; then
            echo "::error::The input service is not a valid name."
            exit 1
          fi
          if [[ ! "$IMAGE_NAME" =~ ^[a-z][a-z0-9-]{0,48}$ ]]; then
            echo "::error::The input image-name is not a valid name."
            exit 1
          fi
          if [[ ! "$REGION" =~ ^[a-z]+-[a-z]+[0-9]$ ]]; then
            echo "::error::The input region is not a valid region."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.workload-identity-provider }}
          service_account: ${{ secrets.service-account }}

      - name: Log in to Artifact Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ inputs.region }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_CHECKS_ANNOTATIONS: false
        with:
          context: ${{ inputs.working-directory }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ secrets.image-path }}/${{ inputs.image-name }}:${{ github.sha }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Replace the image of the service
        env:
          SERVICE: ${{ inputs.service }}
          PROJECT: ${{ secrets.project-id }}
          REGION: ${{ inputs.region }}
          IMAGE: ${{ secrets.image-path }}/${{ inputs.image-name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The build returned no sha256 digest."
            exit 1
          fi
          gcloud run services update "$SERVICE" --project="$PROJECT" --region="$REGION" --image="$IMAGE@$DIGEST" --quiet
